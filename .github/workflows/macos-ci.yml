name: macOS CI

on:
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-ci.yml"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    paths:
      - "macos/**"
      - ".github/workflows/macos-ci.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  test:
    name: macOS / Xcode ${{ matrix.xcode }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: "16.4"
          - runner: macos-26
            xcode: "26.6"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: macos/PackMan
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Run Swift package tests
        run: swift test --parallel -Xswiftc -warnings-as-errors

      - name: Run app and UI tests
        run: >-
          xcodebuild test
          -project PackMan.xcodeproj
          -scheme PackMan
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/PackManDerivedData"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=-
          DEVELOPMENT_TEAM=
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
