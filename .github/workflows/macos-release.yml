name: macOS Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: macos/PackMan
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer

      - name: Run tests
        run: swift test --parallel

      - name: Run app and UI tests
        run: >-
          xcodebuild test
          -project PackMan.xcodeproj
          -scheme PackMan
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/PackManDerivedData"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=-
          DEVELOPMENT_TEAM=

      - name: Build ad-hoc signed app
        env:
          PACKMAN_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          PACKMAN_VERSION="${GITHUB_REF_NAME#v}" ./make-app.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/PackMan-macOS.zip \
              dist/PackMan-macOS.zip.sha256 \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/PackMan-macOS.zip \
              dist/PackMan-macOS.zip.sha256 \
              --verify-tag \
              --generate-notes \
              --title "PackMan ${GITHUB_REF_NAME#v}"
          fi
