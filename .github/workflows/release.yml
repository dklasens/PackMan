name: PackMan Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: macos/PackMan
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - run: swift test --parallel
      - name: Run app and UI tests
        run: >-
          xcodebuild test -project PackMan.xcodeproj -scheme PackMan
          -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/PackManDerivedData"
          CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
      - name: Build ad-hoc signed app
        env:
          PACKMAN_BUILD_NUMBER: ${{ github.run_number }}
        run: PACKMAN_VERSION="${GITHUB_REF_NAME#v}" ./make-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            macos/PackMan/dist/PackMan-macOS.zip
            macos/PackMan/dist/PackMan-macOS.zip.sha256

  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore PackMan.sln
      - run: dotnet build PackMan.sln --configuration Release --no-restore
      - run: dotnet test tests/PackMan.Tests/PackMan.Tests.csproj --configuration Release --no-build
      - name: Publish Windows executable
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish src/PackMan/PackMan.csproj --configuration Release --no-build --no-restore --output dist/windows /p:Version=$version
      - name: Test published Windows executable
        env:
          PACKMAN_UI_TEST_EXE: ${{ github.workspace }}\windows\dist\windows\PackMan.exe
        run: dotnet test tests/PackMan.UiTests/PackMan.UiTests.csproj --configuration Release --no-build
      - name: Package Windows ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath dist/windows/PackMan.exe -DestinationPath dist/PackMan-Windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash dist/PackMan-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PackMan-Windows-x64.zip" | Set-Content dist/PackMan-Windows-x64.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            windows/dist/PackMan-Windows-x64.zip
            windows/dist/PackMan-Windows-x64.zip.sha256

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag --generate-notes --title "PackMan ${GITHUB_REF_NAME#v}"
          fi
