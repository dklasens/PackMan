name: PackMan Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach assets to
        required: true
        default: v1.10
      platform:
        description: Platforms to build and publish (auto matches declared versions)
        type: choice
        options:
          - auto
          - macos
          - windows
          - both
        default: auto

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  platforms:
    name: Select versioned release platforms
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.select.outputs.macos }}
      windows: ${{ steps.select.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Match the tag to platform versions
        id: select
        env:
          REQUESTED_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'auto' }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib, xml.etree.ElementTree as ET
          def version(value):
              if not re.fullmatch(r'v?\d+\.\d+(?:\.\d+)?', value):
                  raise SystemExit(f'Invalid release version: {value}')
              parts = tuple(map(int, value.removeprefix('v').split('.')))
              return parts + (0,) * (3 - len(parts))
          tag = version(os.environ['RELEASE_TAG'])
          spec = pathlib.Path('macos/PackMan/project.yml').read_text()
          mac = re.search(r'MARKETING_VERSION:\s*"?([\d.]+)', spec).group(1)
          win = ET.parse('windows/src/PackMan/PackMan.csproj').findtext('.//Version')
          requested = os.environ['REQUESTED_PLATFORM']
          selected = {name: version(value) == tag for name, value in [('macos', mac), ('windows', win)]}
          if requested != 'auto':
              for name in selected:
                  wanted = requested in (name, 'both')
                  if wanted and not selected[name]:
                      raise SystemExit(f'{name} version does not match the release tag')
                  selected[name] = wanted
          if not any(selected.values()):
              raise SystemExit('No platform version matches the release tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, enabled in selected.items():
                  print(f'{name}={str(enabled).lower()}', file=output)
                  print(f'{name}: {"build" if enabled else "skip"}')
          PY

  macos:
    needs: platforms
    if: needs.platforms.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: macos/PackMan
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - run: swift test --parallel -Xswiftc -warnings-as-errors
      - name: Run app and UI tests
        run: >-
          xcodebuild test -project PackMan.xcodeproj -scheme PackMan
          -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/PackManDerivedData"
          CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Build ad-hoc signed app
        env:
          PACKMAN_BUILD_NUMBER: ${{ github.run_number }}
        run: PACKMAN_VERSION="${RELEASE_TAG#v}" ./make-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            macos/PackMan/dist/PackMan-macOS.zip
            macos/PackMan/dist/PackMan-macOS.zip.sha256
            macos/PackMan/dist/PackMan-macOS.dmg
            macos/PackMan/dist/PackMan-macOS.dmg.sha256

  windows:
    needs: platforms
    if: needs.platforms.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PackMan.sln
      - name: Build with release version
        shell: pwsh
        run: |
          $tagVersion = [version]$env:RELEASE_TAG.TrimStart('v')
          $version = '{0}.{1}.{2}' -f $tagVersion.Major, $tagVersion.Minor, [Math]::Max(0, $tagVersion.Build)
          dotnet build PackMan.sln --configuration Release --no-restore /p:Version=$version
      - run: dotnet test tests/PackMan.Tests/PackMan.Tests.csproj --configuration Release --no-build
      - name: Publish Windows executable
        shell: pwsh
        run: |
          $tagVersion = [version]$env:RELEASE_TAG.TrimStart('v')
          $version = '{0}.{1}.{2}' -f $tagVersion.Major, $tagVersion.Minor, [Math]::Max(0, $tagVersion.Build)
          dotnet publish src/PackMan/PackMan.csproj --configuration Release --no-build --no-restore --output dist/windows /p:Version=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (Get-Item dist/windows/PackMan.exe).VersionInfo.FileVersion
          if ([version]$actual -ne [version]("{0}.{1}.{2}.0" -f ([version]$version).Major, ([version]$version).Minor, [Math]::Max(0, ([version]$version).Build))) {
            throw "Packaged version $actual does not match release $version"
          }
      - name: Test published Windows executable
        env:
          PACKMAN_UI_TEST_EXE: ${{ github.workspace }}\windows\dist\windows\PackMan.exe
        run: dotnet test tests/PackMan.UiTests/PackMan.UiTests.csproj --configuration Release --no-build
      - name: Package Windows EXE, ZIP, and checksums
        shell: pwsh
        run: |
          Copy-Item dist/windows/PackMan.exe dist/PackMan-Windows-x64.exe
          # Pre-1.9 standalone clients look up their own filename in the ZIP.
          Compress-Archive -LiteralPath dist/windows/PackMan.exe, dist/PackMan-Windows-x64.exe -DestinationPath dist/PackMan-Windows-x64.zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path dist/PackMan-Windows-x64.zip))
          try {
            foreach ($name in 'PackMan.exe', 'PackMan-Windows-x64.exe') {
              if ($null -eq $archive.GetEntry($name)) { throw "Missing update compatibility entry: $name" }
            }
          } finally { $archive.Dispose() }
          foreach ($file in 'PackMan-Windows-x64.exe', 'PackMan-Windows-x64.zip') {
            $hash = (Get-FileHash "dist/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file" | Set-Content "dist/$file.sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            windows/dist/PackMan-Windows-x64.exe
            windows/dist/PackMan-Windows-x64.exe.sha256
            windows/dist/PackMan-Windows-x64.zip
            windows/dist/PackMan-Windows-x64.zip.sha256

  publish:
    needs: [macos, windows]
    if: >-
      always()
      && (needs.macos.result == 'success' || needs.windows.result == 'success')
      && (needs.macos.result == 'success' || needs.macos.result == 'skipped')
      && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            notes=".github/release-notes/$tag.md"
            if [ -f "$notes" ]; then
              gh release create "$tag" dist/* \
                --verify-tag --notes-file "$notes" --title "PackMan ${tag#v}" --latest
            else
              gh release create "$tag" dist/* \
                --verify-tag --generate-notes --title "PackMan ${tag#v}" --latest
            fi
          fi
